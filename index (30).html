<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Operation Ground Truth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen first-person corridor. A thin status rail on top, one action prompt at the bottom, and a terminal panel that opens over the scene. Single dark look by choice: a facility in lockdown. */
:root{
  color-scheme:dark;
  --void:#0a121c; --steel:#142130; --steel-2:#1d2f43; --line:#37526d;
  --ink:#e1ebf4; --dim:#93a9bd;
  --amber:#ffb23e; --lock:#ff6152; --clear:#62e6b4;
  --display:"Chakra Petch","Trebuchet MS",Verdana,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 40%,var(--steel-2),var(--void) 70%);color:var(--ink);font:400 16px/1.55 var(--body);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.rail{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(rgba(10,18,28,.92),rgba(10,18,28,0))}
.brand{font:700 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.pips{display:flex;gap:6px;margin-right:auto}
.pip{width:22px;height:28px;border:2px solid var(--lock);display:grid;place-items:center;font:500 12px/1 var(--mono);color:var(--lock)}
.pip.now{border-color:var(--amber);color:var(--amber);background:rgba(255,178,62,.14)}
.pip.ok{border-color:var(--clear);background:var(--clear);color:var(--void)}
.clock{font:500 22px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.low{color:var(--amber)} .clock.over{color:var(--lock)}
.ghost{background:none;border:1px solid var(--line);padding:6px 10px;font-size:13px;color:var(--dim);cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--dim)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim)}

.prompt{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;
  padding:24px 16px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(10,18,28,0),rgba(10,18,28,.94))}
.prompt-in{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;justify-content:center;text-align:center}
.prompt p{margin:0;font:600 17px/1.3 var(--display);letter-spacing:.03em}

.go{background:var(--amber);color:#1a1204;border:0;padding:12px 22px;font:700 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.go:hover{filter:brightness(1.1)}
.go.green{background:var(--clear);color:#04130d}

.overlay{position:fixed;inset:0;z-index:4;overflow-y:auto;background:rgba(8,14,22,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-inline:16px;display:grid}
.panel{margin:auto;width:100%;max-width:780px;background:var(--steel);border:1px solid var(--line);border-top:3px solid var(--amber);
  padding:clamp(18px,4vw,34px);display:flex;flex-direction:column;gap:18px;min-width:0}
.panel.ok{border-top-color:var(--clear)}
.panel.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.panel.shake{animation:none}}
.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0}
.ok .eyebrow{color:var(--clear)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,46px);line-height:1.05;font-weight:700;letter-spacing:.01em}
h2{font-size:clamp(24px,4.4vw,32px);line-height:1.1;font-weight:700}
h3{font-size:17px;font-weight:600;letter-spacing:.03em}
p{margin:0;max-width:66ch}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.head>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--dim)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.field input{background:var(--void);border:1px solid var(--line);padding:12px;font-size:17px;width:100%;max-width:360px}
.row{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap}

.ref{display:flex;flex-wrap:wrap;gap:6px 8px;padding:12px;background:var(--void);border:1px solid var(--line)}
.ref span{font:400 13px/1.3 var(--mono);color:var(--dim)} .ref b{color:var(--amber);font-weight:500}
.ref .cap{flex-basis:100%;text-transform:uppercase;letter-spacing:.12em;font-size:11px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.items>li{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--steel-2);border-left:3px solid var(--line);min-width:0}
.items>li.set{border-left-color:var(--amber)}
.items>li.grp{background:none;border:0;padding:10px 0 0}
.items>li.grp h3{font:500 13px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.card{background:var(--void);border:1px solid var(--line);padding:10px;font-size:14.5px;line-height:1.45}
.card b{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.card.q{border-color:var(--amber)}
blockquote{margin:0;padding:10px 14px;border-left:2px solid var(--amber);background:var(--void);font-style:italic;max-width:66ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.long{flex-direction:column}
.chip{background:var(--void);border:1px solid var(--line);padding:8px 11px;font-size:14.5px;line-height:1.3;cursor:pointer;text-align:left;color:var(--ink)}
.chip b{font:500 14px/1 var(--mono);color:var(--amber);margin-right:6px}
.chip:hover{border-color:var(--amber)}
.chip[aria-checked="true"]{background:var(--amber);border-color:var(--amber);color:#1a1204;font-weight:600}
.chip[aria-checked="true"] b{color:#1a1204}
.codebar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding-top:4px}
.code{font:500 clamp(22px,5vw,30px)/1 var(--mono);letter-spacing:.14em;padding:12px 14px;background:var(--void);border:1px solid var(--line);color:var(--amber);overflow-wrap:anywhere}
.ok .code{color:var(--clear);border-color:var(--clear)}
.fb{min-height:1.5em;font-weight:600}
.fb.bad{color:var(--lock)} .fb.tip{color:var(--amber);font-weight:400}
.why{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0}
.stats div{background:var(--void);border:1px solid var(--line);padding:12px}
.stats dt{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stats dd{margin:6px 0 0;font:500 22px/1.1 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cert{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;border:2px solid var(--clear);outline:1px solid var(--line);outline-offset:5px;padding:clamp(16px,4vw,34px);margin:6px;min-width:0}
.cert p{max-width:none}
.cert-line{color:var(--dim)}
.cert-team{font:700 clamp(28px,6vw,44px)/1.1 var(--display);color:var(--clear);overflow-wrap:anywhere}
.cert-members{font-size:18px;font-weight:500;overflow-wrap:anywhere}
.cert .stats{width:100%;text-align:left}
.stats .wide{grid-column:1/-1}
.stats dd.sm{font-size:16px;line-height:1.35}
.cert .code{font-size:clamp(14px,2.6vw,19px);letter-spacing:.06em;margin:0}
.cert-id{font:400 13px/1.4 var(--mono);color:var(--dim)}
@media print{
  :root{--void:#fff;--steel:#fff;--steel-2:#fff;--line:#666;--ink:#111;--dim:#333;--amber:#111;--clear:#0b5e41;color-scheme:light}
  html,body{height:auto}
  body{overflow:visible;background:#fff}
  #scene,.rail,.prompt,.noprint{display:none!important}
  .overlay{position:static;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;display:block;overflow:visible}
  .panel{border:0;max-width:none;padding:0}
}
@media (max-width:520px){.brand{display:none}.clock{font-size:19px}.prompt p{font-size:15px}}
</style>

</head>

function submit(){
  var i=S.stage, st=ST[i], n=st.items.length, missing=0, right=0, fb=$('#fb');
  for(var k=0;k<n;k++){if(!sels[i][k])missing++;else if(hsh('gt|'+i+'|'+k+'|'+sels[i][k])===HASH[i][k])right++;}
  if(missing){fb.className='fb bad';fb.textContent='The code is incomplete. '+missing+' item'+(missing>1?'s still need':' still needs')+' an answer. No time was removed.';return;}
  if(right<n){
    S.wrong++;S.pen++;save();tick();beep(140,.35,'sawtooth');
    fb.className='fb bad';
    fb.textContent='Code rejected. '+right+' of '+n+' answer'+(n>1?'s are':' is')+' correct. 1:00 was removed from the clock. Change your answers and enter the code again.';
    panel.classList.remove('shake');void panel.offsetWidth;panel.classList.add('shake');return;

  var left=remaining();
  S.codes[i]=codeOf(i);S.stage=i+1;
  if(S.stage===N){S.finish=left;S.done=true;S.at=Date.now();}

    d.R=add(new T.Mesh(doorGeo,pm(tr)));d.R.position.set(.8,1.6,z);

    var lin=add(new T.Mesh(linGeo,steel));lin.position.set(0,3.7,z);
    d.sm=new T.MeshBasicMaterial({color:C.lock});
    [-1.72,1.72].forEach(function(x){var q=add(new T.Mesh(stripGeo,d.sm));q.position.set(x,1.6,z+.28);});
    d.sign=tex(1024,240,function(g,w,h){
      g.fillStyle='#0a121c';g.fillRect(0,0,w,h);var col=d.open?'#62e6b4':'#ff6152';g.strokeStyle=col;g.lineWidth=8;g.strokeRect(4,4,w-8,h-8);
      g.textBaseline='middle';g.textAlign='left';g.fillStyle='#e1ebf4';g.font='600 58px "Chakra Petch",Verdana,sans-serif';g.fillText(st.name.toUpperCase(),40,82,w-80);
      g.fillStyle=col;g.font='700 64px "Chakra Petch",Verdana,sans-serif';g.fillText(d.open?'CLEARED':'LOCKED',40,170);
      g.textAlign='right';g.fillStyle='#93a9bd';g.font='500 48px "IBM Plex Mono",monospace';g.fillText('STATION '+(i+1)+'/'+N,w-40,170);
    });
    texs.push(d.sign);
    var sg=add(new T.Mesh(new T.PlaneGeometry(3,.7),new T.MeshBasicMaterial({map:d.sign})));sg.position.set(0,3.7,z+.26);
    var ped=add(new T.Mesh(new T.BoxGeometry(.5,1.1,.4),dark));ped.position.set(2.15,.55,z+1.3);
    d.scr=new T.MeshBasicMaterial({color:C.amber});var sc=add(new T.Mesh(new T.BoxGeometry(.46,.34,.05),d.scr));sc.position.set(2.15,1.25,z+1.3);sc.rotation.x=-.55;
    d.light=new T.PointLight(C.lock,1.3,13);d.light.position.set(0,2.9,z+2.6);scene.add(d.light);
    doors.push(d);
  });
  var exit=add(new T.Mesh(new T.PlaneGeometry(W,H),new T.MeshBasicMaterial({color:0xe4fff4,fog:false})));exit.position.set(0,H/2,doorZ(N-1)-9.5);
  var el=new T.PointLight(0xbfffe6,1.6,16);el.position.set(0,2.4,doorZ(N-1)-6);scene.add(el);

  function setDoor(i,open,instant){var d=doors[i];if(!d)return;d.open=open;d.t=open?1:0;if(instant)d.o=d.t;var col=open?C.clear:C.lock;d.sm.color.setHex(col);d.light.color.setHex(col);d.scr.color.setHex(open?C.clear:C.amber);d.sign.userData.draw();strips[i].color.setHex(open?0x9ff5d2:0x8a6420);}
  strips[N].color.setHex(0x9ff5d2);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){texs.forEach(function(t){t.userData.draw();});});

  var targetZ=startZ,cb=null,bob=0,mx=0,my=0,lx=0,ly=0;
  window.addEventListener('pointermove',function(e){mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;});
  function size(){var w=innerWidth,h=innerHeight;r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?80:62;cam.updateProjectionMatrix();}
  window.addEventListener('resize',size);size();
  var last=performance.now();
  function frame(now){
    var dt=Math.min(.1,(now-last)/1000);last=now;
    var dz=targetZ-cam.position.z,ad=Math.abs(dz);
    if(ad>.02){var v=Math.min(6.5,Math.max(.9,ad*2.2));cam.position.z+=(dz<0?-1:1)*Math.min(ad,v*dt);bob+=dt;cam.position.y=1.65+(reduce?0:Math.sin(bob*9)*.035);}
    else if(cb){cam.position.z=targetZ;var f=cb;cb=null;f();}
    lx+=(mx-lx)*Math.min(1,dt*5);ly+=(my-ly)*Math.min(1,dt*5);cam.rotation.set(-ly*.1,-lx*.24,0);
    for(var i=0;i<doors.length;i++){var d=doors[i];d.o+=(d.t-d.o)*Math.min(1,dt*3);d.L.position.x=-.8-1.5*d.o;d.R.position.x=.8+1.5*d.o;if(!d.open)d.scr.color.setHex(Math.sin(now/260)>0?C.amber:0xa8701e);}
    r.render(scene,cam);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return {startZ:startZ,endZ:endZ,stopZ:function(i){return doorZ(i)+5.2;},
    walkTo:function(z,f){if(reduce){cam.position.z=z;targetZ=z;setTimeout(f,250);}else{targetZ=z;cb=f;}},
    jump:function(z){cam.position.z=z;targetZ=z;cb=null;},
    openDoor:function(i){setDoor(i,true,false);},
    setProgress:function(n){for(var i=0;i<N;i++)setDoor(i,i<n,true);}};
}
var G=init3D()||{startZ:0,endZ:0,stopZ:function(){return 0;},walkTo:function(z,f){setTimeout(f,300);},jump:function(){},openDoor:function(){},setProgress:function(){}};

/* ---------- boot ---------- */
pips();tick();setInterval(tick,250);
if(S.done){G.setProgress(N);G.jump(G.endZ);showWin();}
else if(S.start){G.setProgress(S.stage);G.jump(G.stopZ(S.stage));arrive();}
else showIntro();
})();
